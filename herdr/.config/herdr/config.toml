onboarding = false
[keys]
prefix = "ctrl+a"
rename_tab = "prefix+comma"
split_horizontal = "prefix+s"
settings = "prefix+;"

[[keys.command]]
key = "shift+cmd+p"
type = "plugin_action"
command = "jt.command-palette.open"
description = "Command palette"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#a6e3a1"
overlay0 = "#f38ba8"

[ui.toast]
delivery = "terminal"

[experimental]
kitty_graphics = true
