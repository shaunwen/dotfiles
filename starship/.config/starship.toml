# ~/.config/starship.toml

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$cmd_duration\
$line_break\
$character
"""

# ---------- core ----------

[directory]
truncation_length = 3

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

[cmd_duration]
min_time = 500
format = "⏱ $duration "

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

# ---------- languages (your stack) ----------

[nodejs]
format = "󰎙 $version "

[python]
format = "󰌠 $version "

[golang]
format = "󰟓 $version "

[rust]
format = "󱘗 $version "
